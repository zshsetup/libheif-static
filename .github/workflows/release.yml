name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the release tag is the version of libheif in vendor/libheif
        run: |
          git submodule update --init --depth 1 vendor/libheif
          version="v$(sed -n 's/^project(libheif .* VERSION \([0-9.]*\).*/\1/p' vendor/libheif/CMakeLists.txt)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match vendor/libheif ($version)"
            exit 1
          fi
  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-14
            asset: macos-arm64
            target: native
            dist_dir: dist
          - os: ubuntu-latest
            asset: linux-amd64
            target: native
            dist_dir: dist
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            target: native
            dist_dir: dist
          - os: ubuntu-latest
            asset: linux-musl-amd64
            target: native
            dist_dir: dist
            musl: true
          - os: ubuntu-24.04-arm
            asset: linux-musl-arm64
            target: native
            dist_dir: dist
            musl: true
          - os: windows-latest
            asset: windows-amd64
            target: native
            dist_dir: dist-windows-amd64
          - os: ubuntu-latest
            asset: windows-arm64
            target: windows-arm64
            dist_dir: dist-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools (Linux)
        if: runner.os == 'Linux' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson nasm
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja meson nasm
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja nasm pkgconfiglite -y
          pip install meson
      - if: ${{ !matrix.musl }}
        shell: bash
        run: ./build.sh --target ${{ matrix.target }}
      - name: Build in Alpine (musl)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.22 sh -c '
            apk add --no-cache bash build-base cmake meson ninja nasm pkgconf git perl python3 linux-headers &&
            git config --global --add safe.directory "*" &&
            ./build.sh --target ${{ matrix.target }}'
      - name: Package static libraries
        shell: bash
        run: |
          dist="${{ matrix.dist_dir }}"
          # the musl build runs as root in a container, which owns dist
          if [ "$RUNNER_OS" = Linux ]; then sudo chown -R "$(id -u):$(id -g)" "$dist"; fi
          # the license texts travel with the libraries
          lic="$dist/share/licenses/libheif-static"
          mkdir -p "$lic"
          cp LICENSE NOTICE "$lic/"
          for dir in vendor/*/; do
            for file in "$dir"LICENSE* "$dir"LICENCE* "$dir"COPYING*; do
              [ -f "$file" ] && cp "$file" "$lic/$(basename "$dir")-$(basename "$file")" || true
            done
          done
          tar -czf libheif-static-${{ matrix.asset }}.tar.gz -C "$dist" .
      - name: Collect sources
        if: matrix.asset == 'linux-amd64'
        shell: bash
        run: tar -czf libheif-static-sources.tar.gz --exclude=.git vendor
      - uses: actions/upload-artifact@v7
        with:
          name: libheif-static-${{ matrix.asset }}
          path: libheif-static-*.tar.gz
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libheif-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
